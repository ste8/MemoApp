# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- build/iOS

variables:
  - group: VariablesGroup01

stages:
  - stage: ios_build
    displayName:  iOS Build
    pool:
      vmImage: "$(macos_version)"
      demands: xcode
    jobs:
    - job: ios_job
      displayName: iOS Job
      steps: 

      #SELECT Xcode VERSION
      - script: |
          set -e
          echo Mac OS version:
          sw_vers -productVersion
          echo
          echo Installed Xcode versions:
          ls /Applications | grep 'Xcode'
          echo
          echo currently selected xcode:
          xcrun xcode-select --print-path
          echo
          echo selecting version $(xcode_version)...
          sudo xcode-select -s /Applications/Xcode_$(xcode_version).app/Contents/Developer
          xcrun xcode-select --print-path
          xcodebuild -version
        displayName: Select Xcode Version
      
      - task: UseDotNet@2
        displayName: Set .NET Version
        inputs:
          packageType: 'sdk'
          version: $(dotnet_version)
      
      - task: Bash@3
        displayName: Install MAUI workloads
        inputs:
          targetType: 'inline'
          script: |
            dotnet nuget locals all --clear 
            dotnet workload install maui --version $(dotnet_workload_version)
          #source for "dotnet nuget locals all --clear": https://www.youtube.com/watch?v=eLY9EDzyvoQ          

      - task: InstallAppleProvisioningProfile@1
        name: installProvProfile
        inputs:
          provisioningProfileLocation: 'secureFiles'
          provProfileSecureFile: MemoApp__Distribution_iOS_AppStore.mobileprovision

      - task: InstallAppleCertificate@2
        inputs:
          certSecureFile: StefanoOttavianiAppleDistributionKey-OpenSSL3.p12
          keychain: "temp"
          certPwd: $(ios_distribution_p12_password)
        displayName: "Install Apple Certificate"
          
      - task: NuGetAuthenticate@1      
      - script: dotnet restore $(app_sln_path)
        displayName: NuGet restore
          
      - task: Bash@3
        displayName: Build iOS app
        inputs:
          targetType: 'inline'
          script: >
            dotnet publish $(app_csproj_path)
            -f net9.0-ios 
            -c $(build_configuration) 
            -o '$(Build.ArtifactStagingDirectory)/iOS' 
            -p:RuntimeIdentifier=ios-arm64 
            -p:ArchiveOnBuild=true 
            -p:CodesignKey="$(codesign_key)" 
            -p:CodesignProvision="$(installProvProfile.provisioningProfileUuid)" 

      - task: PublishBuildArtifacts@1
        displayName: 'Publish iOS app to artifacts'
        inputs:
          PathtoPublish: '$(Build.ArtifactStagingDirectory)/iOS'
          ArtifactName: 'iOS'

      #task installed by extension https://marketplace.visualstudio.com/items?itemName=ms-vsclient.app-store
      #serviceEndpoint 'Apple AppStore Connection' is created and configured in the Project Settings
      - task: AppStoreRelease@1        
        displayName: 'Publish to TestFlight (Apple)'
        inputs:
          serviceEndpoint: 'Apple App Store'
          releaseTrack: 'TestFlight'
          appIdentifier: '$(ios_appIdentifier)'
          appSpecificId: '$(ios_appSpecificId)'
          ipaPath: '$(Build.ArtifactStagingDirectory)/**/*.ipa'
          appType: 'iOS'
          shouldSkipWaitingForProcessing: true
          shouldSkipSubmission: true
          

      

      


